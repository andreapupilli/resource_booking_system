name: CI

on:
  push:
    branches: [ "main", "module2" ]
  pull_request:
    branches: [ "main", "module2" ]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -Dspring.profiles.active=test verify

